[package]
name = "wenku8"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = true

[dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs", rev = "e1320b0a2e11afb59e4dee374883a2212d325699", features = ["helpers"] }
encoding_rs = "0.8.35"
