name: Build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package Aidoku source
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node.js for WASM integration tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Cargo files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-aidoku-${{ hashFiles('Cargo.lock') }}

      - name: Install Aidoku CLI
        run: |
          sdk_revision=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["dependencies"]["aidoku"]["rev"])')
          if ! command -v aidoku >/dev/null 2>&1; then
            cargo install --git https://github.com/Aidoku/aidoku-rs \
              --rev "$sdk_revision" \
              --locked aidoku-cli
          fi

      - name: Set build version
        id: version
        shell: bash
        run: |
          base_version=$(jq '.info.version' res/source.json)
          source_version=$((base_version + GITHUB_RUN_NUMBER))
          release_tag="v0.1.0-build.${GITHUB_RUN_NUMBER}"
          jq --argjson version "$source_version" \
            '.info.version = $version' res/source.json > res/source.json.tmp
          mv res/source.json.tmp res/source.json
          echo "source_version=$source_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Package and verify
        run: |
          sh build.sh
          sha256sum package.aix > SHA256SUMS

      - name: Build and verify subscription
        run: |
          aidoku build package.aix --output public --name 'Wenku8 小说源'
          python3 scripts/verify_subscription.py package.aix public

      - name: Upload subscription
        uses: actions/upload-artifact@v4
        with:
          name: wenku8-source-list
          path: public/
          if-no-files-found: error

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenku8-${{ steps.version.outputs.release_tag }}
          path: |
            package.aix
            SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          SOURCE_VERSION: ${{ steps.version.outputs.source_version }}
        shell: bash
        run: |
          notes="Automated build of ${GITHUB_SHA}. Aidoku source version: ${SOURCE_VERSION}."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" package.aix SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" package.aix SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "Wenku8 build ${SOURCE_VERSION}" \
              --notes "$notes"
          fi

  publish-subscription:
    name: Publish Aidoku subscription
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: wenku8-source-list
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wenku8-source-list
          path: public
      - name: Publish versioned packages and source list
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          branch: gh-pages
          folder: public
          clean: false
          force: false
          commit-message: 'Publish Wenku8 Aidoku subscription'
